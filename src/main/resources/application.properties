spring.application.name=mottgen

# Spring AI 2.x + Google Gemini. API võti tuleb keskkonnamuutujast GOOGLE_API_KEY, mitte koodist.
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.response-mime-type=application/json

# Temperature: kiri peab olema loomulik, aga mitte liiga "loov" (fakte välja mõtlev)
spring.ai.google.genai.chat.temperature=0.6
spring.ai.google.genai.chat.max-output-tokens=1500

# Rakenduse enda piirangud
mottgen.job-posting.max-chars=8000
mottgen.job-posting.timeout-ms=8000
mottgen.cv.max-chars=12000
